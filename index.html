<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Teddy Day 🧸</title>

<style>
body{
    margin:0;
    height:100vh;
    background: linear-gradient(#ffafbd, #ffc3a0);
    overflow:hidden;
    font-family: 'Segoe UI', sans-serif;
}

/* Falling Teddies */
.fall{
    position:absolute;
    top:-50px;
    font-size:30px;
    animation: fall linear infinite;
}

@keyframes fall{
    to{
        transform: translateY(110vh);
    }
}

/* Center Teddy */
.scene{
    position:absolute;
    top:50%;
    left:50%;
    transform: translate(-50%,-50%);
    text-align:center;
    cursor:pointer;
}

.teddy{
    font-size:150px;
    transition: 0.5s;
}

.arm{
    position:absolute;
    font-size:55px;
    top:70px;
    transition:0.6s;
}

.left{
    left:-40px;
}
.right{
    right:-40px;
}

.hug .left{
    transform: rotate(35deg) translateX(45px);
}
.hug .right{
    transform: rotate(-35deg) translateX(-45px);
}

/* Heart */
.heart{
    font-size:45px;
    opacity:0;
}
.hug .heart{
    opacity:1;
    animation: glow 1.5s infinite;
}

@keyframes glow{
    0%{transform: scale(1);}
    50%{transform: scale(1.4);}
    100%{transform: scale(1);}
}

/* Note */
.note{
    max-width:300px;
    margin-top:15px;
    font-size:16px;
    color:#8b004f;
    opacity:0;
    transition:1s;
}

.hug .note{
    opacity:1;
}

.tap{
    font-size:18px;
    color:#fff;
}
</style>
</head>

<body>

<div class="scene" onclick="hug()">
    <div class="heart">💖</div>
    <div class="arm left">🤎</div>
    <div class="arm right">🤎</div>
    <div class="teddy">🧸</div>

    <div class="note">
        Hello, my teddy,...<br><br> 
        Aap bhi mere liye ek teddy ki tarah ho, Cute se, pyari se, aur bahut kuch😋 <br><br>  
        Jab aap thak jao, sad ho jao  
        ya bina wajah smile chahiye ho —<br><br>  
        **samajh lena main yahin hoon ❤️**<br><br>
        From--Aapka Dumb😅  

        <br><br>
        Happy Teddy Day to my cute teddy 🧸💖
    </div>

    <div class="tap">Tap the Teddy 🤍</div>
</div>

<audio id="song" loop>
    <source src="teddy-song.mp3" type="audio/mpeg">
</audio>

<script>
function hug(){
    document.querySelector(".scene").classList.toggle("hug");
    document.getElementById("song").play();
}

/* Generate falling teddies */
for(let i=0;i<20;i++){
    let teddy = document.createElement("div");
    teddy.innerHTML="🧸";
    teddy.className="fall";
    teddy.style.left = Math.random()*100+"vw";
    teddy.style.animationDuration = (3+Math.random()*4)+"s";
    teddy.style.opacity = Math.random();
    document.body.appendChild(teddy);
}
</script>

</body>
</html>
